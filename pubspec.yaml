name: mytube
description: "Personal Video Hub — local-first Android video library."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  drift: 2.35.2
  drift_flutter: 0.3.1
  sqlite3_flutter_libs: 0.6.0+eol
  uuid: ^4.5.1
  video_player: ^2.14.1
  clock: ^1.1.2
  path: ^1.9.1
  path_provider: ^2.1.6
  wakelock_plus: ^1.8.2
  screen_brightness: ^2.1.11
  volume_controller: ^3.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.35.1
  build_runner: 2.15.1
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true
